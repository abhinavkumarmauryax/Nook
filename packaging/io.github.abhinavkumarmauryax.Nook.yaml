app-id: io.github.abhinavkumarmauryax.Nook
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: nook

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --filesystem=home
  - --device=dri

modules:
  - name: nook
    buildsystem: simple
    build-commands:
      - install -Dm755 nook-linux-x64 /app/bin/nook
      - install -Dm644 nook.desktop /app/share/applications/io.github.abhinavkumarmauryax.Nook.desktop
      - install -Dm644 nook-icon.png /app/share/icons/hicolor/256x256/apps/io.github.abhinavkumarmauryax.Nook.png
    sources:
      - type: file
        path: ../nook-linux-x64
      - type: file
        path: nook.desktop
      - type: file
        path: nook-icon.png
