<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Nook Session</title>
<link rel="icon" type="image/png" href="/assets/nook-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="join-page">
  <div class="card">
    <img class="brand-logo" src="/assets/nook-logo.svg" alt="Nook">
    <h1 class="wordmark">Join Nook</h1>
    <p>Enter a username to join the watch room</p>
    <div class="form-group">
      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" maxlength="32" placeholder="e.g. Alex" autocomplete="off">
    </div>
    <div id="error" class="error"></div>
    <button id="joinBtn" class="btn btn-primary" style="width:100%">Join room</button>
    <p class="empty" style="margin-top:18px">No account needed. Usernames must be unique within the session.</p>
  </div>
</div>
<script src="/js/socket.io.js"></script>
<script src="/js/join.js"></script>
</body>
</html>
