<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nook</title>
<link rel="icon" type="image/png" href="/assets/nook-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-left">
      <img class="brand-logo header-logo" src="/assets/nook-logo.svg" alt="Nook">
      <h1 id="videoTitle">Nook</h1>
      <span class="badge" id="hostBadge" style="display:none">OWNER</span>
      <span class="badge badge-admin" id="adminBadge" style="display:none">ADMIN</span>
    </div>
    <div class="header-right">
      <span id="connStatus">● Connected</span>
      <button id="popoutBtnTop" class="btn btn-small" title="Open chat in a new tab">💬 Pop Out</button>
      <button id="leaveBtn" class="btn btn-danger">Leave</button>
    </div>
  </header>

  <div class="main" id="mainLayout">
    <div class="video-section">
      <div class="video-card">
        <div class="video-wrapper" id="videoWrapper">
          <video id="video" playsinline preload="metadata" controlsList="nodownload"></video>
          <div id="loadingOverlay" class="overlay">
            <div class="spinner"></div><span>Loading video…</span>
          </div>
          <div id="errorOverlay" class="overlay error" style="display:none">
            <div style="text-align:center">
              <span id="errorMsg">Unable to play video</span>
              <div id="errorDiagRow" style="display:none; margin-top:10px; font-size:11px; color:var(--muted); text-align:left; max-width:400px; margin:10px auto; background:rgba(0,0,0,0.3); padding:8px; border-radius:6px; word-break:break-all;"><div id="errorDiag"></div></div>
              <button id="retryBtn" class="btn btn-primary" style="margin-top:12px; display:none">Retry</button>
            </div>
          </div>
          <div class="controls">
            <button id="playPauseBtn" class="icon-btn" title="Play/Pause">▶</button>
            <button id="muteBtn" class="icon-btn" title="Mute/unmute">🔊</button>
            <input id="volumeRange" type="range" min="0" max="1" step="0.1" value="1" aria-label="Volume">
            <input id="seekRange" type="range" min="0" max="100" value="0" aria-label="Timeline" title="Only the owner can seek">
            <span id="timeDisplay">0:00 / 0:00</span>
            <button id="fullscreenBtn" class="icon-btn" title="Fullscreen">⛶</button>
          </div>
        </div>
        <div class="video-footer">
          <button id="selectVideoBtn" class="btn" style="display:none">📁 Select Video</button>
          <button id="localVideoBtn" class="btn" style="display:none">📂 Local File (no upload)</button>
          <button id="videoUrlBtn" class="btn" style="display:none">🔗 Video URL</button>
          <input id="hostFileInput" type="file" accept="video/*" style="display:none">
          <button id="toggleChatBtn" class="btn btn-small" title="Show/hide chat">💬 Hide Chat</button>
          <button id="popoutBtn" class="btn btn-small" title="Open chat in a new tab">↗ Pop Out Chat</button>
        </div>
      </div>
    </div>

    <div id="resizeHandle" class="resize-handle" title="Drag to resize chat"></div>

    <div class="chat-section" id="chatSection">
      <div class="chat-card">
        <div class="chat-header">
          <h2>💬 <span id="chatLabel">Chat</span></h2>
          <span id="roomInfo">Online: <span id="onlineCount">0</span></span>
        </div>
        <div id="messages" class="messages"></div>
        <div class="chat-footer">
          <input id="messageInput" type="text" placeholder="Type a message…" maxlength="500">
          <button id="sendBtn" class="btn btn-primary">Send</button>
        </div>
        <div class="users-list">
          <button id="toggleUsersBtn" class="users-toggle" aria-expanded="true">Participants ▾</button>
          <ul id="users"></ul>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="localFileModal" class="modal-overlay" style="display:none">
  <div class="modal-box local-file-modal">
    <h3 class="modal-title">Share a local video file</h3>
    <p class="modal-message">Choose a file already on this computer. It is streamed directly from disk — nothing is uploaded or copied, so even very large files work instantly.</p>
    <div class="local-path-row">
      <input id="localPathInput" class="modal-input" placeholder="C:\Users\...\video.mp4" style="margin:0">
      <button id="browseHomeBtn" class="btn btn-small">Home</button>
      <button id="browseDownloadsBtn" class="btn btn-small">Downloads</button>
    </div>
    <div id="browseCrumb" class="browse-crumb"></div>
    <div id="browseList" class="browse-list"></div>
    <div class="modal-actions">
      <button id="localFileCancel" class="btn">Cancel</button>
      <button id="localFileUse" class="btn btn-primary">Use this file</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>
<script src="/js/socket.io.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/hls.min.js"></script>
<script src="/js/watch.js"></script>
</body>
</html>
